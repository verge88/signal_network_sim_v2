name: SIP TICD run-robust threshold calibration independent test
on:
  push:
    branches: [improve/ticd-run-robust-calibration]
    paths:
      - 'sip/ticd_run_robust_alert.py'
      - 'experiments/evaluate_ticd_run_robust.py'
      - '.github/workflows/sip-ticd-run-robust.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_run_robust_alert.py experiments/evaluate_ticd_run_robust.py
          python -m pip freeze > run_robust_environment.txt
      - name: Recover frozen role-adaptive score and source report
        run: |
          set -euo pipefail
          gh run download 45377337545 --repo "${{ github.repository }}" --name sip-ticd-role-adaptive-causal-model-and-holdout --dir prior
          p="$(find prior -type f -name role_adaptive_causal_ticd.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Run robust calibration and untouched paired evaluation
        run: python -m experiments.evaluate_ticd_run_robust --prior "$PRIOR_DIR" --out results_run_robust
      - name: Verify threshold-only change and split accounting
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_run_robust/run_robust_report.json'))
          assert not d['real_field_validation'] and not d['heldout_used_for_selection']
          assert d['score_frozen'] and d['warning_reference_frozen'] and d['seed_oracle_invariance']
          assert d['batch_invariance'] and d['model_reload']
          seeds=[s for k in ('normal_validation_seeds','development_seeds','test_seeds') for xs in d[k].values() for s in xs]
          assert len(seeds)==len(set(seeds))==148
          for k,pair in d['heldout'].items():
              for n,v in pair.items():
                  assert v['confirmed_TP']+v['warning_only_TP']==v['covered_attack_rows']
                  assert len(d['per_seed'][k][n])==5
          print('ROBUST_AUDIT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-run-robust-model-and-holdout
          path: |
            results_run_robust/
            run_robust_environment.txt
          if-no-files-found: warn
          retention-days: 30
