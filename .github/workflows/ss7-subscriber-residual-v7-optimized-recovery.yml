name: SS7 subscriber residual-KIE v7 optimized recovery
on:
  push:
    branches: [ss7-anti-overfit-development]
    paths:
      - .github/workflows/ss7-subscriber-residual-v7-optimized-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  SS7_SUBSCRIBER_KIE_V7: "1"
  SS7_DEPLOY_BASELINE: "180"
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cu_compact_channel_development.py ss7/subscriber_residual_rank_audit.py
      - run: python -u -m ss7.cu_compact_channel_development selftest
      - run: python -u -m ss7.cu_compact_channel_development generate --arm compact --seed 26102 --output results/world
      - uses: actions/upload-artifact@v4
        with:
          name: residual-v7-opt-world-compact-26102
          path: results/world
          retention-days: 7

  audit:
    needs: world
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46132390936
          name: residual-v7-world-compact-26101
          path: results/incoming/world-compact-26101
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46132390936
          name: residual-v7-world-compact-26103
          path: results/incoming/world-compact-26103
      - uses: actions/download-artifact@v4
        with:
          name: residual-v7-opt-world-compact-26102
          path: results/incoming/world-compact-26102
      - run: |
          mkdir -p results/worlds
          mv results/incoming/world-compact-* results/worlds/
      - run: python -u -m ss7.subscriber_residual_rank_audit --root results/worlds --output results/audit --seeds 26101 26102 26103
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-subscriber-residual-v7-optimized-rank-audit
          path: results/audit
          retention-days: 7
