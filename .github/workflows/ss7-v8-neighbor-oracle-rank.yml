name: SS7 v8 neighborhood observability oracle RANK
on:
  push:
    branches: [ss7-anti-overfit-development]
    paths:
      - .github/workflows/ss7-v8-neighbor-oracle-rank.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  SS7_SUBSCRIBER_KIE_V8: "1"
  SS7_DEPLOY_BASELINE: "180"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/naive_neighbor_oracle_v8_audit.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46139416635
          name: peer-v8-world-compact-27101
          path: results/worlds/world-compact-27101
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46139416635
          name: peer-v8-world-compact-27102
          path: results/worlds/world-compact-27102
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46139416635
          name: peer-v8-world-compact-27103
          path: results/worlds/world-compact-27103
      - run: python -u -m ss7.naive_neighbor_oracle_v8_audit --root results/worlds --output results/audit --seeds 27101 27102 27103
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-v8-neighbor-oracle-rank
          path: results/audit
          retention-days: 7
