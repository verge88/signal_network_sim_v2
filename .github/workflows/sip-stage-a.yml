name: SIP stage A external dataset inventory

on:
  push:
    branches: [validation/sip-stage-a-independent]
    paths:
      - '.github/workflows/sip-stage-a.yml'
      - 'experiments/sip_stage_a_inventory.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gdown
        run: python -m pip install 'gdown>=6.1,<7'
      - name: Inventory Alvares and Di Mauro independent datasets
        run: python experiments/sip_stage_a_inventory.py
      - name: Publish inventory in build summary
        if: always()
        run: |
          echo '## SIP stage A: external dataset access' >> "$GITHUB_STEP_SUMMARY"
          for f in results_stage_a/*_inventory.json; do
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            head -c 20000 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sip-stage-a-inventory
          path: results_stage_a/
          if-no-files-found: warn
