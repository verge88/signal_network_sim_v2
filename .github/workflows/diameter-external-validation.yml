name: Diameter external PCAP validation

on:
  push:
    branches:
      - main
      - validation/diameter-external-pcap
      - improve/diameter-isolation-forest-robustness
    paths:
      - "diameter/**"
      - "experiments/diameter_external_pcap_validation.py"
      - ".github/workflows/diameter-external-validation.yml"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-validation:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '/run-diameter-external-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn networkx

      - name: Download pinned independent Diameter wire captures
        env:
          SOURCE_COMMIT: 8917b2d8d4ab16a2877a7c2c1bccb1bc2e789864
        run: |
          mkdir -p external_pcaps
          base="https://raw.githubusercontent.com/KellyKinyama/diameter-protocol/${SOURCE_COMMIT}"
          for name in s6a.pcap gy.pcap rx.pcap gy_mscc.pcap; do
            curl --fail --location --retry 3 "${base}/${name}" -o "external_pcaps/${name}"
          done
          sha256sum external_pcaps/*.pcap | tee external_pcaps/SHA256SUMS
          cat > external_pcaps/PROVENANCE.txt <<EOF
          Source repository: KellyKinyama/diameter-protocol
          Source commit: ${SOURCE_COMMIT}
          Files: s6a.pcap, gy.pcap, rx.pcap, gy_mscc.pcap

          Upstream README states these are wire captures verified against a real
          freeDiameter/Open5GS peer or through a freeDiameter relay. They are
          independent of signal_network_sim_v2 and are not generated by this
          simulator. They are benign lab/conformance traffic, not production
          operator traffic and not an attack-labelled corpus.
          EOF

      - name: Decode capture inventory
        run: |
          for pcap in external_pcaps/*.pcap; do
            echo "=== ${pcap} ==="
            capinfos -c -u -a -e "${pcap}" || true
            td=$(mktemp -d)
            cp "${pcap}" "${td}/input.pcap"
            tshark -r "${td}/input.pcap" -Y diameter -T fields               -e diameter.cmd.code -e diameter.applicationId | head -n 30
            rm -rf "${td}"
          done

      - name: Run independent validation
        run: |
          PYTHONPATH=. python experiments/diameter_external_pcap_validation.py             external_pcaps/s6a.pcap             external_pcaps/gy.pcap             external_pcaps/rx.pcap             external_pcaps/gy_mscc.pcap             --out-dir results_external_diameter

      - name: Publish step summary
        if: always()
        run: |
          if [ -f results_external_diameter/summary.json ]; then
            {
              echo "## Diameter external validation"
              echo
              echo '~~~json'
              cat results_external_diameter/summary.json
              echo '~~~'
              echo
              echo "### Per-capture predictions"
              echo
              echo '~~~'
              cat results_external_diameter/external_capture_predictions.csv
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diameter-external-validation
          path: |
            results_external_diameter/
            external_pcaps/SHA256SUMS
            external_pcaps/PROVENANCE.txt
          if-no-files-found: warn
