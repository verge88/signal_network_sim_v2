name: SS7 heavy-hitter v22 optimized recovery 40102
on:
  push:
    branches: [ss7-anti-overfit-development]
    paths:
      - .github/workflows/ss7-v22-heavy-hitter-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  SS7_SUBSCRIBER_KIE_V22: "1"
  SS7_DEPLOY_BASELINE: "180"
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cu_compact_channel_development.py ss7/v22_heavy_hitter_rank.py
      - run: python -u -m ss7.cu_compact_channel_development selftest
      - run: python -u -m ss7.cu_compact_channel_development generate --arm compact --seed 40102 --output results/world
      - uses: actions/upload-artifact@v4
        with:
          name: v22-opt-world-compact-40102
          path: results/world
          retention-days: 7

  audit:
    needs: world
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46158335231
          name: v22-world-compact-40101
          path: results/worlds/world-compact-40101
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46158335231
          name: v22-world-compact-40103
          path: results/worlds/world-compact-40103
      - uses: actions/download-artifact@v4
        with:
          name: v22-opt-world-compact-40102
          path: results/worlds/world-compact-40102
      - run: python -u -m ss7.v22_heavy_hitter_rank --root results/worlds --output results/audit --seeds 40101 40102 40103
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-v22-heavy-hitter-recovered-rank
          path: results/audit
          retention-days: 7
