name: SS7 separate alert calibration
on:
  push:
    branches: [ss7-separate-alert-calibration]
    paths:
      - .github/workflows/ss7-separate-alert-calibration.yml
      - ss7/separate_alert_calibration.py
      - ss7/causal_temporal_calibration.py
      - ss7/incident_calibration_study.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ss7-separate-alert-calibration-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  SS7_DEPS: numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install $SS7_DEPS
      - name: Check separate thresholds and notification semantics
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from ss7.causal_temporal_calibration import cutoff
          from ss7.incident_calibration_study import metrics, triple
          from ss7.separate_alert_calibration import thresholds

          ref = pd.DataFrame(dict(nid=[1, 1, 1, 2, 2, 2], t=[0, 1, 2, 0, 1, 3],
                                  label=[0] * 6))
          ref_scores = np.array([.95, .20, .40, .10, .30, .40])
          policies = thresholds((ref,), (ref_scores,))
          joint = cutoff(ref, ref_scores, 10, 1)
          assert policies == {"shared": (joint, joint), "separate": (.95, .20)}

          d = pd.DataFrame(dict(nid=[1, 1, 1, 1, 2, 2], t=[0, 1, 2, 5, 5, 6],
                                label=[0] * 6, episode_id=[-1] * 6))
          s = np.array([.6, .7, .8, .95, .9, .9])
          z = triple(d, s)
          assert np.array_equal(np.flatnonzero(np.isfinite(z)), [2])
          raw, notice = policies["separate"]
          old, _ = metrics(d, s, z, raw)
          shared, _ = metrics(d, s, z, raw, notification_threshold=raw)
          separate, _ = metrics(d, s, z, raw, notification_threshold=notice)
          assert old == shared
          assert separate["false_windows_day"] == 0
          assert separate["notifications"] == 1 and shared["notifications"] == 0

          mixed = ref.assign(label=[0, 1, 0, 0, 0, 0])
          assert thresholds((mixed,), (ref_scores,))["separate"] == (.95, 1.)
          print("Window/notification thresholds, strict ties, gap reset and missing tail checks passed")
          PY
  test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [9101, 9102, 9103, 9104, 9105, 9106, 9107, 9108]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install $SS7_DEPS
      - uses: actions/download-artifact@v4
        with:
          name: report-only-frozen
          path: results/frozen
          github-token: ${{ github.token }}
          run-id: 45421952080
      - uses: actions/download-artifact@v4
        with:
          name: incident-local-models
          path: results/local
          github-token: ${{ github.token }}
          run-id: 45440533210
      - name: Evaluate both frozen models on the same world
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -o pipefail
          directory="results/seed_${SEED}"
          mkdir -p "$directory"
          python -u -m ss7.separate_alert_calibration test --seed "$SEED" \
            --local results/local/local_models.joblib --report results/frozen/models.joblib \
            --output "$directory" 2>&1 | tee "$directory/test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: separate-alert-seed-${{ matrix.seed }}
          path: results/seed_${{ matrix.seed }}
          if-no-files-found: warn
  aggregate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install $SS7_DEPS
      - uses: actions/download-artifact@v4
        with:
          pattern: separate-alert-seed-*
          path: results/collected
      - name: Aggregate paired results
        run: |
          python -m ss7.separate_alert_calibration aggregate \
            --input results/collected --output results/summary | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-separate-alert-calibration-summary
          path: results/summary
          if-no-files-found: error
