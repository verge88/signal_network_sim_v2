name: Diameter external cascade validation

on:
  push:
    branches: [validation/diameter-cascade-external]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONUNBUFFERED: "1"

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Install the historical environment
        run: |
          python -m pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 matplotlib==3.11.2 networkx==3.6.1
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: ten-seed-calibration
          path: profile
          run-id: 45599697858
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: run-1
          path: reference
          run-id: 45599697858
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and freeze repetition 1
        env:
          DIAMETER_CALIBRATION_PROFILE: profile/calibration_profile.json
        run: |
          set -euo pipefail
          mkdir -p data frozen
          pids=()
          for seed in 110000 111000 112000; do
            python diameter/diameter_sim_v1.py --seed "$seed" --out "data/sim-$seed.csv.gz" > "data/sim-$seed.log" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          python diameter/diameter_external_cascade.py freeze \
            --reference reference/seeds.json --diagnostics reference/compromise_recall_diagnostics.json \
            --profile "$DIAMETER_CALIBRATION_PROFILE" --train data/sim-110000.csv.gz \
            --validation data/sim-111000.csv.gz --stack data/sim-112000.csv.gz --out frozen
          python -m pip freeze > frozen/versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diameter-frozen-cascade
          path: frozen/
          if-no-files-found: error

  check-previous-external-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diameter-pcap-native-transfer
          path: previous
          run-id: 45451701468
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inventory the prior PCAP-native data
        run: |
          set -euo pipefail
          mkdir audit
          find previous -type f | sed 's@^previous/@@' | sort > audit/previous-artifact-inventory.txt
          test -s audit/previous-artifact-inventory.txt
          cat audit/previous-artifact-inventory.txt
          if test -z "$(find previous -type f -name cascade-manifest.json -print -quit)"; then
            echo 'External cascade metrics pending: the previous archive has no cascade input manifest.' | tee audit/status.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'A candidate cascade manifest requires provenance review before scoring.' | tee audit/status.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: diameter-previous-external-input-audit
          path: audit/
          if-no-files-found: error
