name: SS7 dissertation independent confirmation
on:
  push:
    branches: [ss7-dissertation-confirmation]
    paths:
      - ss7/dissertation_confirmation.py
      - ss7/fix.py
      - .github/workflows/ss7-dissertation-confirmation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ss7-dissertation-confirmation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile ss7/fix.py ss7/dissertation_confirmation.py
      - run: |
          set -o pipefail
          mkdir -p results/dev
          python -u -m ss7.dissertation_confirmation train --output results/dev 2>&1 | tee results/dev/train.log
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-ss7-models
          path: results/dev
  test:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [8201,8202,8203,8204,8205,8206,8207,8208,8209,8210,8211,8212]
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frozen-ss7-models
          path: results/dev
      - run: |
          set -o pipefail
          mkdir -p results/seed_${{ matrix.seed }}
          python -u -m ss7.dissertation_confirmation test --seed ${{ matrix.seed }} --models results/dev/models.joblib --output results/seed_${{ matrix.seed }} 2>&1 | tee results/seed_${{ matrix.seed }}/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmation-seed-${{ matrix.seed }}
          path: results/seed_${{ matrix.seed }}
  aggregate:
    needs: [train,test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: confirmation-seed-*
          path: results/collected
      - run: python -m ss7.dissertation_confirmation aggregate --input results/collected --output results/summary
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-dissertation-confirmation-results
          path: results/summary
