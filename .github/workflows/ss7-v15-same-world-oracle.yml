name: SS7 v15 same-world oracle diagnostic
on:
  push:
    branches: [ss7-anti-overfit-development]
    paths:
      - .github/workflows/ss7-v15-same-world-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  SS7_SUBSCRIBER_KIE_V15: "1"
  SS7_DEPLOY_BASELINE: "180"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/v15_same_world_oracle_audit.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46146326903
          pattern: v15-world-compact-*
          path: results/incoming
      - run: |
          mkdir -p results/worlds
          for d in results/incoming/v15-world-compact-*; do
            mv "$d" "results/worlds/${d##*/v15-}"
          done
      - run: python -u -m ss7.v15_same_world_oracle_audit --root results/worlds --output results/audit --seeds 35101 35102 35103
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-v15-same-world-oracle
          path: results/audit
          retention-days: 7
