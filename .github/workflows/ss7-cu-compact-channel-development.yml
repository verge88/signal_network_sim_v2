name: SS7 compact CU and channel calibration screen
on:
  push:
    branches: [ss7-cu-compact-channel-development]
    paths: [.github/workflows/ss7-cu-compact-channel-development.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ss7-cu-compact-channel-development-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        arm: [dense,compact]
        seed: [21001,21002,21003,21101,21102,21201,21202,21301,21302]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cu_compact_channel_development.py
      - run: python -u -m ss7.cu_compact_channel_development selftest
      - run: python -u -m ss7.cu_compact_channel_development generate --arm ${{ matrix.arm }} --seed ${{ matrix.seed }} --output results/world
      - uses: actions/upload-artifact@v4
        with:
          name: world-${{ matrix.arm }}-${{ matrix.seed }}
          path: results/world
          retention-days: 7
  train:
    needs: worlds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [dense,compact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          pattern: world-${{ matrix.arm }}-210*
          path: results/worlds
      - run: python -u -m ss7.cu_compact_channel_development train --arm ${{ matrix.arm }} --root results/worlds --output results/trained
      - uses: actions/upload-artifact@v4
        with:
          name: trained-${{ matrix.arm }}
          path: results/trained
  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [dense,compact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          pattern: world-${{ matrix.arm }}-21[123]*
          path: results/worlds
      - uses: actions/download-artifact@v4
        with:
          name: trained-${{ matrix.arm }}
          path: results/trained
      - run: python -u -m ss7.cu_compact_channel_development evaluate --arm ${{ matrix.arm }} --root results/worlds --models results/trained --output results/eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.arm }}
          path: results/eval
  aggregate:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: results/eval
      - run: python -u -m ss7.cu_compact_channel_development aggregate --root results/eval --output results/summary
      - uses: actions/upload-artifact@v4
        with:
          name: compact-cu-channel-summary
          path: results/summary
