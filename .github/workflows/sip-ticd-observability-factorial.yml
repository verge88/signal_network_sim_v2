name: SIP TICD expanded observability and factorial ablation
on:
  push:
    branches: [study/ticd-observability-factorial]
    paths:
      - 'sip/ticd_observability_factorial.py'
      - 'experiments/simulate_ticd_extended_observation.py'
      - 'experiments/evaluate_ticd_observability_factorial.py'
      - '.github/workflows/sip-ticd-observability-factorial.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_observability_factorial.py experiments/simulate_ticd_extended_observation.py experiments/evaluate_ticd_observability_factorial.py
          python -m pip freeze > observability_environment.txt
      - name: Recover frozen TICD
        run: |
          set -euo pipefail
          gh run download 45377337545 --repo "${{ github.repository }}" --name sip-ticd-role-adaptive-causal-model-and-holdout --dir prior
          p="$(find prior -type f -name role_adaptive_causal_ticd.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Execute common independent tests
        run: python -m experiments.evaluate_ticd_observability_factorial --prior "$PRIOR_DIR" --out results_observability
      - name: Verify scope, seeds and paired configurations
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_observability/observability_factorial_report.json'))
          assert not d['real_field_validation'] and not d['test_used_for_selection']
          assert all(d[k] for k in ('observational_equivalence_verified','external_audit_is_synthetic','no_native_SBC_compromise_model','label_and_batch_invariance'))
          seeds=[s for k in ('training_seeds','validation_seeds','test_seeds') for xs in d[k].values() for s in xs]
          assert len(seeds)==len(set(seeds))==173
          assert len(d['heldout'])==25 and len(d['references'])==18
          for k,mods in d['heldout'].items():
              assert len(mods)==18
              for n,v in mods.items():
                  assert v['rows']==19800 and v['complete_rows']+v['partial_rows']+v['unobservable_rows']==v['rows']
                  assert [x['seed'] for x in d['per_seed'][k][n]]==d['test_seeds'][k]
                  if n.endswith('__none'):
                      assert v['confirmed_TP']==v['confirmed_FP']==v['warning_only_TP']==v['warning_only_FP']==0
              assert len(d['factorial_main_and_interaction_effects']['refit'][k])==7
          assert d['master_audit']['master_policy']['positive']>0
          print('OBS_AUDIT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-observability-factorial
          path: |
            results_observability/
            observability_environment.txt
          if-no-files-found: warn
          retention-days: 30
