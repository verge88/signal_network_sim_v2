name: SIP stage A Di Mauro real capture probe

on:
  push:
    branches: [validation/sip-stage-a-independent]
    paths:
      - '.github/workflows/sip-stage-a-dimauro.yml'
      - 'experiments/sip_stage_a_dimauro_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'gdown>=6.1,<7'
      - name: Download real LTE trace ZIP and enumerate captures
        run: python experiments/sip_stage_a_dimauro_probe.py
      - name: Show dataset metadata
        if: always()
        run: |
          cat results_stage_a/dimauro_zip_inventory.json || true
          cat results_stage_a/alvares_http_probe.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-stage-a-dimauro-metadata
          path: results_stage_a/*.json
          if-no-files-found: warn
