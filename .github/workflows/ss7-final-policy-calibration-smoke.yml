name: SS7 final policy CAL-only smoke
on:
  push:
    branches: [ss7-anti-overfit-robust-dev]
    paths:
      - .github/workflows/ss7-final-policy-calibration-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ss7-final-policy-calibration-smoke-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cu_compact_channel_development.py
      - run: python -u -m ss7.cu_compact_channel_development selftest
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46063674571
          pattern: world-compact-210*
          path: results/worlds
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46063674571
          pattern: world-compact-212*
          path: results/worlds
      - run: python -u -m ss7.cu_compact_channel_development train --arm compact --root results/worlds --output results/trained
      - run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import ss7.cu_compact_channel_development as M
          M.evaluate_final(Path("results/worlds"),Path("results/trained"),Path("results/smoke"),"compact",())
          c=pd.read_csv("results/smoke/calibration_controls.csv")
          assert (c.false_windows_day <= M.RAW_BUDGET + 1e-12).all(), c
          assert (c.false_notifications_day <= M.INCIDENT_BUDGET + 1e-12).all(), c
          print("FINAL CAL-ONLY POLICY PASSED")
          print(c.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-final-policy-calibration-smoke
          path: |
            results/trained/generalization.csv
            results/smoke
          retention-days: 7
