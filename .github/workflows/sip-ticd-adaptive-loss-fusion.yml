name: SIP TICD robust causal transport-state estimation
on:
  push:
    branches: [study/ticd-adaptive-loss-fusion]
    paths:
      - 'sip/ticd_measured_loss.py'
      - 'sip/ticd_loss_state_filter.py'
      - 'experiments/evaluate_ticd_adaptive_loss_fusion.py'
      - 'experiments/simulate_ticd_adaptive_loss_fusion.py'
      - '.github/workflows/sip-ticd-adaptive-loss-fusion.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_measured_loss.py sip/ticd_loss_state_filter.py experiments/evaluate_ticd_adaptive_loss_fusion.py experiments/simulate_ticd_adaptive_loss_fusion.py
          python -m pip freeze > adaptive_loss_fusion_environment.txt
      - name: Recover architecture and benign traffic profile
        run: |
          set -euo pipefail
          gh run download 45575470092 --repo "${{ github.repository }}" --name sip-ticd-measured-loss --dir prior
          p="$(find prior -type f -name measured_loss_models.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Refit and evaluate six observation modes
        run: python -m experiments.evaluate_ticd_adaptive_loss_fusion --prior "$PRIOR_DIR" --out results_adaptive_loss_fusion
      - name: Verify frozen architecture and independent evaluation
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_adaptive_loss_fusion/adaptive_loss_fusion_report.json'))
          assert not d['test_used_for_selection'] and not d['real_field_validation']
          assert all(d[k] for k in ('all_original_invariants_preserved','prefix_causality','label_and_batch_invariance','observational_equivalence_verified','oracle_only_control','all_active_references_refit','oracle_removal_verified','measured_fallback_verified','state_filter_verified','joint_outage_and_passive_bias_stress','probe_load_accounted','passive_sensor_assumed','reload_verified'))
          assert len(d['candidates'])==96
          assert len(d['references'])==6
          assert all(v['full_refit'] and v['oracle_only']==(k=='oracle') for k,v in d['references'].items())
          assert all(m['probe_load_accounted'] and m['passive_two_point_sensor_assumed'] for ms in d['metadata'].values() for m in ms)
          for v in d['candidates'].values():
              assert v['all_original_invariants_preserved']
              assert sum(v['budgets'])<=.008+1e-12 and v['warning_budget']==.002
          seeds=[s for k in ('training_seeds','validation_seeds','development_seeds','test_seeds') for xs in d[k].values() for s in xs]
          assert len(seeds)==len(set(seeds))==408
          assert d['commissioning_runs']==408 and len(d['paired'])==30
          assert all(len(v)==5 for v in d['test_seeds'].values())
          assert all(m['commissioning_clean'] and m['independent_dynamic_rng'] and m['commissioning_rows']==3960 for ms in d['metadata'].values() for m in ms)
          assert len(d['development'])==len(d['heldout'])==40 and len(d['summary'])==12
          for k,mods in d['heldout'].items():
              assert len(mods)==12
              for n,v in mods.items():
                  assert v['rows']==19800
                  assert [r['seed'] for r in d['per_seed'][k][n]]==d['test_seeds'][k]
                  assert v['complete_rows']+v['partial_rows']+v['unobservable_rows']==v['rows']
          print('ADAPT_AUDIT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-adaptive-loss-fusion
          path: |
            results_adaptive_loss_fusion/
            adaptive_loss_fusion_environment.txt
          if-no-files-found: warn
          retention-days: 30
