name: Diameter jDiameter untouched final confirmation

on:
  push:
    branches:
      - improve/diameter-pcap-native-transfer
    paths:
      - "experiments/jdiameter_final/**"
      - ".github/workflows/diameter-jdiameter-final-confirmation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jdiameter-final:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JDIAMETER_COMMIT: 7f3909342cca30ffc7e69b7d8b4111f5fde52ece

    steps:
      - name: Checkout detector at frozen method
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Install capture and Python dependencies
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark tcpdump netcat-openbsd
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy networkx scikit-learn pyyaml

      - name: Download frozen global PCAP-native model
        uses: actions/download-artifact@v4
        with:
          name: diameter-bromelia-local-calibration-confirmation
          path: frozen_model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 45435041027

      - name: Checkout pinned independent RestComm jDiameter stack
        run: |
          git clone https://github.com/RestComm/jdiameter.git external_jdiameter
          git -C external_jdiameter checkout "${JDIAMETER_COMMIT}"
          cp experiments/jdiameter_final/ExampleClient.java \
            external_jdiameter/examples/guide1/src/main/java/org/example/client/ExampleClient.java
          cp experiments/jdiameter_final/ExampleServer.java \
            external_jdiameter/examples/guide1/src/main/java/org/example/server/ExampleServer.java
          sed -i 's/AuthApplId value="333333"/AuthApplId value="16777251"/g' \
            external_jdiameter/examples/guide1/src/main/resources/org/example/client/client-jdiameter-config.xml \
            external_jdiameter/examples/guide1/src/main/resources/org/example/server/server-jdiameter-config.xml
          {
            echo "Final confirmation stack: RestComm/jdiameter"
            echo "Pinned commit: ${JDIAMETER_COMMIT}"
            echo "Detector method frozen before this source was executed."
            echo "Calibration: benign-only local reference/conformal PCAPs."
            echo "Test: disjoint benign and attack captures."
          } > JDIAMETER_PROVENANCE.txt

      - name: Build jDiameter guide stack with frozen S6a driver
        run: |
          cd external_jdiameter
          mvn -B -DskipTests -pl examples/guide1 -am package
          jar=$(find examples/guide1/target -name '*jar-with-dependencies.jar' | head -1)
          test -n "${jar}"
          echo "${jar}" > /tmp/jdiameter_jar
          echo "Built: ${jar}"

      - name: Start independent jDiameter S6a responder
        run: |
          jar="$GITHUB_WORKSPACE/external_jdiameter/$(cat /tmp/jdiameter_jar)"
          (
            cd external_jdiameter
            java -cp "${jar}" org.example.server.ExampleServer
          ) > jdiameter_server.log 2>&1 &
          echo $! > /tmp/jdiameter_server.pid
          for i in {1..60}; do
            if grep -q "JDIAMETER_FINAL_SERVER_READY" jdiameter_server.log && nc -z 127.0.0.1 3868; then
              echo "jDiameter server ready"
              exit 0
            fi
            sleep 1
          done
          cat jdiameter_server.log
          exit 1

      - name: Capture 64 benign local-calibration sessions
        run: |
          set -euo pipefail
          mkdir -p jdiameter_benign_calibration
          manifest="jdiameter_benign_calibration/manifest.csv"
          echo "capture,expected_label,scenario,role" > "${manifest}"
          jar="$GITHUB_WORKSPACE/external_jdiameter/$(cat /tmp/jdiameter_jar)"

          capture_case() {
            name="$1"; scenario="$2"; count="$3"; delay="$4"; role="$5"
            out="$GITHUB_WORKSPACE/jdiameter_benign_calibration/${name}"
            sudo tcpdump -i lo -U -s 0 -B 4096 -w "${out}" 'tcp port 3868' >"/tmp/${name}.tcpdump.log" 2>&1 &
            cap_pid=$!
            for i in {1..60}; do
              grep -q "listening on lo" "/tmp/${name}.tcpdump.log" && break
              sleep 0.05
            done
            grep -q "listening on lo" "/tmp/${name}.tcpdump.log"
            sleep 0.50
            (
              cd external_jdiameter
              java -cp "${jar}" org.example.client.ExampleClient \
                "${scenario}" "${count}" "${delay}"
            )
            sleep 0.50
            sudo kill -INT "${cap_pid}" || true
            wait "${cap_pid}" || true
            sudo chown "$USER":"$USER" "${out}"
            test "$(stat -c%s "${out}")" -gt 24
            echo "${name},benign,${scenario},${role}" >> "${manifest}"
          }

          # 24 reference captures, covering three ordinary S6a procedures.
          for i in {1..8}; do
            count=$((1 + (i - 1) % 8))
            delay=$((140 + 30 * i))
            capture_case "ref_attach_${i}.pcap" benign_attach "${count}" "${delay}" reference
            capture_case "ref_reauth_${i}.pcap" benign_reauth "${count}" "$((delay + 35))" reference
            capture_case "ref_update_${i}.pcap" benign_update "${count}" "$((delay + 70))" reference
          done

          # 40 separate conformal captures. They never fit the reference manifold.
          for i in {1..14}; do
            count=$((1 + (i * 3) % 10))
            delay=$((120 + 25 * i))
            capture_case "cal_attach_${i}.pcap" benign_attach "${count}" "${delay}" calibration
          done
          for i in {1..13}; do
            count=$((1 + (i * 5) % 11))
            delay=$((145 + 28 * i))
            capture_case "cal_reauth_${i}.pcap" benign_reauth "${count}" "${delay}" calibration
          done
          for i in {1..13}; do
            count=$((1 + (i * 7) % 11))
            delay=$((165 + 26 * i))
            capture_case "cal_update_${i}.pcap" benign_update "${count}" "${delay}" calibration
          done

          python - <<'PY'
          import pandas as pd
          m = pd.read_csv("jdiameter_benign_calibration/manifest.csv")
          assert len(m) == 64
          assert set(m["expected_label"]) == {"benign"}
          assert (m["role"] == "reference").sum() == 24
          assert (m["role"] == "calibration").sum() == 40
          print(m.groupby(["role", "scenario"]).size())
          PY
          sha256sum jdiameter_benign_calibration/*.pcap > jdiameter_benign_calibration/SHA256SUMS

      - name: Fit frozen benign-only local adaptation
        run: |
          python experiments/diameter_pcap_native_detector.py calibrate-local \
            --model frozen_model/results_bromelia_model/pcap_native_bundle.pkl \
            --manifest jdiameter_benign_calibration/manifest.csv \
            --pcap-dir jdiameter_benign_calibration \
            --target-fpr 0.05 \
            --out jdiameter_local_calibration.json
          python - <<'PY'
          import json
          d=json.load(open("jdiameter_local_calibration.json"))
          assert d["method"] == "deployment_benign_confirmed_channel_ensemble_split_conformal"
          assert d["reference_capture_count"] == 24
          assert d["conformal_capture_count"] == 40
          print("Frozen local method confirmed:", d["method"])
          PY

      - name: Capture disjoint final test sessions
        run: |
          set -euo pipefail
          mkdir -p jdiameter_final_test
          manifest="jdiameter_final_test/manifest.csv"
          echo "capture,expected_label,scenario" > "${manifest}"
          jar="$GITHUB_WORKSPACE/external_jdiameter/$(cat /tmp/jdiameter_jar)"

          capture_case() {
            name="$1"; label="$2"; scenario="$3"; count="$4"; delay="$5"
            out="$GITHUB_WORKSPACE/jdiameter_final_test/${name}"
            sudo tcpdump -i lo -U -s 0 -B 4096 -w "${out}" 'tcp port 3868' >"/tmp/final-${name}.log" 2>&1 &
            cap_pid=$!
            for i in {1..60}; do
              grep -q "listening on lo" "/tmp/final-${name}.log" && break
              sleep 0.05
            done
            grep -q "listening on lo" "/tmp/final-${name}.log"
            sleep 0.50
            (
              cd external_jdiameter
              java -cp "${jar}" org.example.client.ExampleClient \
                "${scenario}" "${count}" "${delay}"
            )
            sleep 0.50
            sudo kill -INT "${cap_pid}" || true
            wait "${cap_pid}" || true
            sudo chown "$USER":"$USER" "${out}"
            bytes=$(stat -c%s "${out}")
            if [ "${bytes}" -le 24 ]; then
              echo "Invalid empty final PCAP: ${name}"
              exit 1
            fi
            echo "${name},${label},${scenario}" >> "${manifest}"
          }

          # Eight benign sessions, counts/delays not used in local calibration.
          capture_case benign_attach_3.pcap benign benign_attach 3 610
          capture_case benign_attach_6.pcap benign benign_attach 6 730
          capture_case benign_attach_9.pcap benign benign_attach 9 520
          capture_case benign_reauth_2.pcap benign benign_reauth 2 690
          capture_case benign_reauth_6.pcap benign benign_reauth 6 570
          capture_case benign_reauth_9.pcap benign benign_reauth 9 760
          capture_case benign_update_4.pcap benign benign_update 4 640
          capture_case benign_update_8.pcap benign benign_update 8 710

          # Sixteen predeclared attacks: four intensities for each family.
          for n in 16 32 64 128; do
            capture_case "attack_air_${n}.pcap" attack air_flood "${n}" 0
            capture_case "attack_ulr_${n}.pcap" attack ulr_flood "${n}" 0
          done
          for n in 20 40 80 160; do
            capture_case "attack_mixed_${n}.pcap" attack mixed_flood "${n}" 0
            capture_case "attack_tracking_${n}.pcap" attack tracking_burst "${n}" 0
          done

          python - <<'PY'
          import pandas as pd
          m=pd.read_csv("jdiameter_final_test/manifest.csv")
          assert len(m)==24
          assert (m.expected_label=="benign").sum()==8
          assert (m.expected_label=="attack").sum()==16
          print(m.groupby(["expected_label","scenario"]).size())
          PY
          sha256sum jdiameter_final_test/*.pcap > jdiameter_final_test/SHA256SUMS

      - name: Score untouched jDiameter final test
        run: |
          python experiments/diameter_pcap_native_detector.py score \
            --model frozen_model/results_bromelia_model/pcap_native_bundle.pkl \
            --local-calibration jdiameter_local_calibration.json \
            --manifest jdiameter_final_test/manifest.csv \
            --pcap-dir jdiameter_final_test \
            --out-dir results_jdiameter_final

      - name: Apply predeclared final acceptance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("results_jdiameter_final/summary.json").read_text())
          result={
            "source": "RestComm/jdiameter",
            "source_commit": "7f3909342cca30ffc7e69b7d8b4111f5fde52ece",
            "role": "untouched final confirmation after method freeze",
            "predeclared_gate": {
              "attack_tpr_min": 0.80,
              "benign_fpr_max": 0.125,
              "balanced_accuracy_min": 0.83
            },
            "observed": {
              "attack_tpr": s["external_attack_tpr"],
              "benign_fpr": s["external_benign_fpr"],
              "f1": s["external_f1"],
              "balanced_accuracy": s["external_balanced_accuracy"]
            },
            "per_scenario": s["per_scenario"]
          }
          Path("jdiameter_final_confirmation.json").write_text(
              json.dumps(result,indent=2),encoding="utf-8")
          print(json.dumps(result,indent=2))
          if float(s["external_attack_tpr"]) < 0.80:
            raise SystemExit("FINAL FAIL: attack TPR below 80%")
          if float(s["external_benign_fpr"]) > 0.125:
            raise SystemExit("FINAL FAIL: benign FPR above 12.5%")
          if float(s["external_balanced_accuracy"]) < 0.83:
            raise SystemExit("FINAL FAIL: balanced accuracy below 0.83")
          PY

      - name: Stop jDiameter server
        if: always()
        run: |
          if [ -f /tmp/jdiameter_server.pid ]; then
            kill "$(cat /tmp/jdiameter_server.pid)" || true
          fi
          tail -n 150 jdiameter_server.log || true

      - name: Upload final confirmation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diameter-jdiameter-untouched-final-confirmation
          path: |
            JDIAMETER_PROVENANCE.txt
            jdiameter_server.log
            jdiameter_benign_calibration/
            jdiameter_local_calibration.json
            jdiameter_final_test/
            results_jdiameter_final/
            jdiameter_final_confirmation.json
          if-no-files-found: warn
