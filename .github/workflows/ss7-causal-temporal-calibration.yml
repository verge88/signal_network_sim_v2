name: SS7 causal temporal calibration
on:
  push:
    branches: [ss7-causal-temporal-calibration]
    paths: [.github/workflows/ss7-causal-temporal-calibration.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ss7-causal-temporal-calibration-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [9001,9002,9003,9004,9005,9006,9007,9008]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/causal_temporal_calibration.py
      - name: Check temporal causality and calibration
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from ss7.causal_temporal_calibration import causal, calibrate, margin
          d=pd.DataFrame(dict(nid=[1,1,1,1,2,2],t=[0,1,2,4,0,1],
            ntype=["SP"]*4+["STP"]*2,label=[0,0,0,0,0,0]))
          s=np.array([.1,.9,.5,.3,.8,.2])
          a=causal(d,s,3)
          assert np.allclose(a,[.1,.5,.5,.3,.8,.5])
          for i in range(1,len(d)+1):
              assert np.allclose(causal(d.iloc[:i],s[:i],3),a[:i])
          assert np.array_equal(causal(d,s,1),s)
          th=calibrate((d,), (s,), "role", .5)
          assert set(th)=={"SP","STP"}
          assert np.isfinite(margin(d,s,th)).all()
          assert not (margin(d,s,th)>0).any()
          print("Causality, gap reset and role budget checks passed")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: report-only-frozen
          path: results/frozen
          github-token: ${{ github.token }}
          run-id: 45421952080
      - uses: actions/download-artifact@v4
        with:
          name: incident-local-models
          path: results/local
          github-token: ${{ github.token }}
          run-id: 45440533210
      - run: |
          set -o pipefail
          mkdir -p results/seed_${{ matrix.seed }}
          python -u -m ss7.causal_temporal_calibration test --seed ${{ matrix.seed }} --local results/local/local_models.joblib --frozen results/frozen/models.joblib --output results/seed_${{ matrix.seed }} 2>&1 | tee results/seed_${{ matrix.seed }}/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-seed-${{ matrix.seed }}
          path: results/seed_${{ matrix.seed }}
  aggregate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          pattern: causal-seed-*
          path: results/collected
      - run: python -m ss7.causal_temporal_calibration aggregate --input results/collected --output results/summary
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-causal-temporal-calibration-summary
          path: results/summary
