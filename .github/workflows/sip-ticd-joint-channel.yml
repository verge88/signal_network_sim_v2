name: SIP TICD joint channel calibration
on:
  push:
    branches: [study/ticd-joint-channel-calibration]
    paths:
      - 'sip/ticd_joint_channel_calibration.py'
      - 'experiments/evaluate_ticd_joint_channel_calibration.py'
      - '.github/workflows/sip-ticd-joint-channel.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_joint_channel_calibration.py experiments/evaluate_ticd_joint_channel_calibration.py
          python -m pip freeze > joint_environment.txt
      - name: Recover frozen comparator
        run: |
          set -euo pipefail
          gh run download 45612416004 --repo "${{ github.repository }}" --name sip-ticd-correlated-block --dir prior
          p="$(find prior -type f -name correlated_block_models.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Calibrate, select and independently evaluate
        run: python -m experiments.evaluate_ticd_joint_channel_calibration --prior "$PRIOR_DIR" --out results_joint_channel
      - name: Verify experiment integrity
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_joint_channel/joint_channel_report.json'))
          assert not d['test_used_for_selection'] and not d['real_field_validation']
          assert all(d[k] for k in ('prefix_causality','label_and_batch_invariance','oracle_removal_verified','reload_verified','observational_equivalence_verified','all_original_invariants_preserved','frozen_feature_references','missing_primary_no_alert_verified','all_configurations_eligible','joint_calibration_no_independence_assumption'))
          seeds=[s for k in ('scale_seeds','validation_seeds','development_seeds','test_seeds') for ss in d[k].values() for s in ss]
          assert len(seeds)==len(set(seeds))
          assert len(d['heldout'])==40 and len(d['summary'])==13 and len(d['paired'])==21
          assert len(d['selection'])==240 and all(len(v)==10 for v in d['test_seeds'].values())
          print('JOINT_AUDIT_VERIFIED', 'operational_gate_pass=',d['operational_gate_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-joint-channel
          path: |
            results_joint_channel/
            joint_environment.txt
          if-no-files-found: warn
          retention-days: 30
