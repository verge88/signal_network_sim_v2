name: SS7 paired observability audit
on:
  push:
    branches: [ss7-paired-observability-audit]
    paths: [.github/workflows/ss7-paired-observability-audit.yml, ss7/paired_observability_audit.py]
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [8501,8502,8503]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/paired_observability_audit.py
      - run: python -u -m ss7.paired_observability_audit --seed ${{ matrix.seed }} --output results/audit_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: paired-audit-${{ matrix.seed }}
          path: results/audit_${{ matrix.seed }}
