name: SS7 peer-service subscriber KIE v10 RANK
on:
  push:
    branches: [ss7-anti-overfit-development]
    paths:
      - .github/workflows/ss7-peer-service-subscriber-kie-v10-rank.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  SS7_SUBSCRIBER_KIE_V10: "1"
  SS7_DEPLOY_BASELINE: "180"
jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [30101,30102,30103]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cu_compact_channel_development.py ss7/peer_service_subscriber_kie_rank_audit.py
      - run: python -u -m ss7.cu_compact_channel_development selftest
      - run: python -u -m ss7.cu_compact_channel_development generate --arm compact --seed ${{ matrix.seed }} --output results/world
      - uses: actions/upload-artifact@v4
        with:
          name: peer-service-v10-world-compact-${{ matrix.seed }}
          path: results/world
          retention-days: 7

  audit:
    needs: worlds
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          pattern: peer-service-v10-world-compact-*
          path: results/incoming
      - run: |
          mkdir -p results/worlds
          for d in results/incoming/peer-service-v10-world-compact-*; do
            mv "$d" "results/worlds/${d##*/peer-service-v10-}"
          done
      - run: python -u -m ss7.peer_service_subscriber_kie_rank_audit --root results/worlds --output results/audit --seeds 30101 30102 30103
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-peer-service-subscriber-kie-v10-rank
          path: results/audit
          retention-days: 7
