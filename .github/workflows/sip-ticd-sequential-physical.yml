name: SIP TICD sequential physical evidence
on:
  push:
    branches: [study/ticd-sequential-physical-evidence]
    paths:
      - 'sip/ticd_sequential_physical.py'
      - 'experiments/evaluate_ticd_sequential_physical.py'
      - '.github/workflows/sip-ticd-sequential-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_sequential_physical.py experiments/evaluate_ticd_sequential_physical.py
          python -m pip freeze > sequential_environment.txt
      - name: Recover frozen comparator
        run: |
          set -euo pipefail
          gh run download 45589776522 --repo "${{ github.repository }}" --name sip-ticd-adaptive-loss-fusion --dir prior
          p="$(find prior -type f -name adaptive_loss_fusion_models.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Calibrate, select and independently evaluate
        run: python -m experiments.evaluate_ticd_sequential_physical --prior "$PRIOR_DIR" --out results_sequential_physical
      - name: Verify experiment integrity
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_sequential_physical/sequential_physical_report.json'))
          assert not d['test_used_for_selection'] and not d['real_field_validation']
          assert all(d[k] for k in ('prefix_causality','label_and_batch_invariance','oracle_removal_verified','reload_verified','observational_equivalence_verified','all_original_invariants_preserved','frozen_feature_references'))
          seeds=[s for k in ('validation_seeds','development_seeds','test_seeds') for ss in d[k].values() for s in ss]
          assert len(seeds)==len(set(seeds))
          assert len(d['heldout'])==40 and len(d['summary'])==9 and len(d['paired'])==15
          assert all(len(v)==5 for v in d['test_seeds'].values())
          print('SEQ_AUDIT_VERIFIED', 'operational_gate_pass=',d['operational_gate_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-sequential-physical
          path: |
            results_sequential_physical/
            sequential_environment.txt
          if-no-files-found: warn
          retention-days: 30
