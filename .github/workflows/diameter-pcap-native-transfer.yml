name: Diameter PCAP-native transfer validation

on:
  push:
    branches:
      - improve/diameter-pcap-native-transfer
      - main
    paths:
      - "experiments/diameter_pcap_native_detector.py"
      - "experiments/diameter_external_pcap_validation.py"
      - "experiments/diameter_external_attack_validation.py"
      - "experiments/diameter_external_attack_driver.dart"
      - "diameter/**"
      - ".github/workflows/diameter-pcap-native-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diameter-pcap-native-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pcap-native-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ORANGE_COMMIT: 75b350c22cc744d5742fcb71777cd3c9b131c19c
      KELLY_COMMIT: 8917b2d8d4ab16a2877a7c2c1bccb1bc2e789864
      DIAMETER_CALIBRATION_PROFILE: results_pcap_native_calibration/calibration_profile.json

    steps:
      - name: Checkout detector repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark tcpdump netcat-openbsd
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy networkx scikit-learn

      - name: Compile PCAP-native code
        run: |
          python -m py_compile             experiments/diameter_pcap_native_detector.py             experiments/diameter_external_pcap_validation.py             experiments/diameter_external_attack_validation.py             experiments/diameter_calibrate_from_independent_pcaps.py

      - name: Download independent Orange calibration PCAPs
        run: |
          set -euo pipefail
          mkdir -p orange_calibration_pcaps
          base="https://raw.githubusercontent.com/Orange-OpenSource/diafuzzer/${ORANGE_COMMIT}/captures"
          curl -fL --retry 4 -o orange_calibration_pcaps/S6a.pcap "${base}/S6a.pcap"
          curl -fL --retry 4 -o orange_calibration_pcaps/S6a_perso.pcap "${base}/S6a_perso.pcap"
          curl -fL --retry 4 -o orange_calibration_pcaps/Cx.pcap "${base}/Cx.pcap"
          sha256sum orange_calibration_pcaps/*.pcap | tee orange_calibration_pcaps/SHA256SUMS
          {
            echo "Source: Orange-OpenSource/diafuzzer"
            echo "Pinned commit: ${ORANGE_COMMIT}"
            echo "Role: simulator calibration + benign threshold calibration only"
            echo "Never used as final external holdout"
          } > orange_calibration_pcaps/PROVENANCE.txt

      - name: Calibrate simulator from Orange PCAPs
        run: |
          python experiments/diameter_calibrate_from_independent_pcaps.py             orange_calibration_pcaps/S6a.pcap             orange_calibration_pcaps/S6a_perso.pcap             orange_calibration_pcaps/Cx.pcap             --out-dir results_pcap_native_calibration             --source "Orange-OpenSource/diafuzzer"             --source-commit "${ORANGE_COMMIT}"             --prior-strength 40

      - name: Train PCAP-native detector with seed-separated domain randomisation
        run: |
          python experiments/diameter_pcap_native_detector.py train             --calibration-pcaps               orange_calibration_pcaps/S6a.pcap               orange_calibration_pcaps/S6a_perso.pcap               orange_calibration_pcaps/Cx.pcap             --out-dir results_pcap_native_train

      - name: Download untouched Kelly benign holdout
        run: |
          set -euo pipefail
          mkdir -p kelly_benign
          base="https://raw.githubusercontent.com/KellyKinyama/diameter-protocol/${KELLY_COMMIT}"
          for f in s6a.pcap gy.pcap rx.pcap gy_mscc.pcap; do
            curl -fL --retry 4 -o "kelly_benign/${f}" "${base}/${f}"
          done
          {
            echo "capture,expected_label,scenario"
            echo "s6a.pcap,benign,kelly_s6a"
            echo "gy.pcap,benign,kelly_gy"
            echo "rx.pcap,benign,kelly_rx"
            echo "gy_mscc.pcap,benign,kelly_gy_mscc"
          } > kelly_benign/manifest.csv
          sha256sum kelly_benign/*.pcap | tee kelly_benign/SHA256SUMS

      - name: Score untouched Kelly benign holdout with PCAP-native model
        run: |
          python experiments/diameter_pcap_native_detector.py score             --model results_pcap_native_train/pcap_native_bundle.pkl             --manifest kelly_benign/manifest.csv             --pcap-dir kelly_benign             --out-dir results_pcap_native_benign

      - name: Checkout pinned Kelly Diameter stack
        run: |
          git clone --filter=blob:none https://github.com/KellyKinyama/diameter-protocol.git external_diameter
          git -C external_diameter checkout "${KELLY_COMMIT}"
          cp experiments/diameter_external_attack_driver.dart external_diameter/bin/external_attack_driver.dart
          cd external_diameter
          dart pub get
          dart analyze bin/external_attack_driver.dart

      - name: Start independent S6a HSS
        run: |
          (
            cd external_diameter
            HSS_BIND=127.0.0.1 HSS_PORT=3868             HSS_ORIGIN_HOST=hss.open5gs.org HSS_ORIGIN_REALM=open5gs.org             dart run bin/hss_stub.dart
          ) > external_hss.log 2>&1 &
          echo $! > /tmp/external_hss.pid
          for i in {1..30}; do
            if nc -z 127.0.0.1 3868; then exit 0; fi
            sleep 1
          done
          cat external_hss.log
          exit 1

      - name: Capture untouched reproduced attack holdout
        env:
          S6A_HOST: 127.0.0.1
          S6A_PORT: "3868"
          S6A_DEST_REALM: open5gs.org
          S6A_IMSI: "999700000000001"
        run: |
          set -euo pipefail
          mkdir -p kelly_attack_holdout
          manifest="kelly_attack_holdout/manifest.csv"
          echo "capture,expected_label,scenario" > "${manifest}"

          capture_case() {
            name="$1"; label="$2"; scenario="$3"; count="$4"; delay_ms="$5"
            out="$GITHUB_WORKSPACE/kelly_attack_holdout/${name}"
            sudo tcpdump -i lo -U -s 0 -w "${out}" 'tcp port 3868' >/tmp/tcpdump.log 2>&1 &
            cap_pid=$!
            sleep 1.25
            (
              cd external_diameter
              dart run bin/external_attack_driver.dart "${scenario}" "${count}" "${delay_ms}"
            )
            sleep 0.75
            sudo pkill -INT -x tcpdump || true
            wait "${cap_pid}" || true
            sudo chown "$USER":"$USER" "${out}"
            test -s "${out}"
            echo "${name},${label},${scenario}" >> "${manifest}"
          }

          capture_case benign_attach_1.pcap benign benign_attach 1 800
          capture_case benign_attach_2.pcap benign benign_attach 2 1200
          capture_case benign_reauth_2.pcap benign benign_reauth 2 1200
          capture_case benign_reauth_3.pcap benign benign_reauth 3 1500
          capture_case attack_air_flood_20.pcap attack air_flood 20 0
          capture_case attack_air_flood_80.pcap attack air_flood 80 0
          capture_case attack_ulr_flood_20.pcap attack ulr_flood 20 0
          capture_case attack_ulr_flood_80.pcap attack ulr_flood 80 0
          capture_case attack_mixed_flood_20.pcap attack mixed_flood 20 0
          capture_case attack_mixed_flood_60.pcap attack mixed_flood 60 0
          capture_case attack_tracking_burst_10.pcap attack tracking_burst 10 0
          capture_case attack_tracking_burst_30.pcap attack tracking_burst 30 0

          sha256sum kelly_attack_holdout/*.pcap | tee kelly_attack_holdout/SHA256SUMS
          {
            echo "Source implementation: KellyKinyama/diameter-protocol"
            echo "Pinned commit: ${KELLY_COMMIT}"
            echo "Role: external development-domain regression set after first inspection"
            echo "Not used for numeric threshold fitting; after first inspection it is not claimed as final untouched confirmation"
          } > kelly_attack_holdout/PROVENANCE.txt

      - name: Score attack holdout with PCAP-native model
        run: |
          python experiments/diameter_pcap_native_detector.py score             --model results_pcap_native_train/pcap_native_bundle.pkl             --manifest kelly_attack_holdout/manifest.csv             --pcap-dir kelly_attack_holdout             --out-dir results_pcap_native_attacks

      - name: Run robust IF baseline on identical attack holdout
        run: |
          PYTHONPATH=experiments:. python experiments/diameter_external_attack_validation.py             --manifest kelly_attack_holdout/manifest.csv             --pcap-dir kelly_attack_holdout             --out-dir results_pcap_native_robust_if

      - name: Build two-mode development summary and primary-detector gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from sklearn.metrics import balanced_accuracy_score, f1_score, recall_score

          native = pd.read_csv("results_pcap_native_attacks/predictions.csv")
          native_benign_summary = json.loads(Path(
              "results_pcap_native_benign/summary.json").read_text())
          robust_summary = json.loads(Path(
              "results_pcap_native_robust_if/summary.json").read_text())
          robust = pd.read_csv("results_pcap_native_robust_if/external_attack_predictions.csv")
          merged = native.merge(
              robust[["capture", "iso_robust_pred_anomaly", "iso_robust_anomaly_score"]],
              on="capture", how="inner", validate="one_to_one")
          y = (merged["expected_label"] == "attack").astype(int).to_numpy()
          n = merged["pcap_native_pred_anomaly"].astype(int).to_numpy()
          r = merged["iso_robust_pred_anomaly"].astype(int).to_numpy()
          # Operational semantics: robust IF is the anomaly trigger and the
          # supervised PCAP-native branch confirms the alert.  OR is retained
          # only as a broad monitoring signal, not the final alarm.
          merged["broad_monitoring_alert"] = ((n == 1) | (r == 1)).astype(int)
          merged["hybrid_alert"] = ((n == 1) & (r == 1)).astype(int)
          merged["supervised_confirmation"] = merged["hybrid_alert"]
          h = merged["hybrid_alert"].to_numpy()
          broad = merged["broad_monitoring_alert"].to_numpy()

          native_tpr = float(recall_score(y, n, zero_division=0))
          native_fpr = float(n[y == 0].mean())
          hybrid_tpr = float(recall_score(y, h, zero_division=0))
          hybrid_fpr = float(h[y == 0].mean())
          summary = {
              "architecture": {
                  "full_mode": "56-feature CU/zone/temporal detector",
                  "portable_mode": "PCAP-native supervised ensemble with wire-observable temporal/volume features",
                  "portable_primary": "PCAP-native supervised ensemble",
                  "portable_secondary_monitor": "robust IF",
                  "portable_high_specificity_optional": "robust IF AND PCAP-native supervised",
              },
              "legacy_16_feature_rf_external_attack_tpr": float(
                  robust_summary["rf_external_attack_tpr"]),
              "legacy_16_feature_rf_external_benign_fpr": float(
                  robust_summary["rf_external_benign_fpr"]),
              "robust_if_external_attack_tpr": float(
                  robust_summary["iso_robust_external_attack_tpr"]),
              "robust_if_external_benign_fpr": float(
                  robust_summary["iso_robust_external_benign_fpr"]),
              "pcap_native_external_attack_tpr": native_tpr,
              "pcap_native_external_benign_fpr": native_fpr,
              "pcap_native_static_kelly_benign_fpr": float(
                  native_benign_summary["external_benign_fpr"]),
              "pcap_native_external_f1": float(f1_score(y, n, zero_division=0)),
              "pcap_native_external_balanced_accuracy": float(
                  balanced_accuracy_score(y, n)),
              "broad_monitoring_attack_tpr": float(
                  recall_score(y, broad, zero_division=0)),
              "broad_monitoring_benign_fpr": float(broad[y == 0].mean()),
              "hybrid_external_attack_tpr": hybrid_tpr,
              "hybrid_external_benign_fpr": hybrid_fpr,
              "hybrid_external_f1": float(f1_score(y, h, zero_division=0)),
              "hybrid_external_balanced_accuracy": float(
                  balanced_accuracy_score(y, h)),
              "holdout_role": "Kelly external development-domain regression set; not final untouched confirmation",
          }
          Path("results_pcap_native_hybrid").mkdir(exist_ok=True)
          merged.to_csv(
              "results_pcap_native_hybrid/predictions.csv", index=False)
          Path("results_pcap_native_hybrid/summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False),
              encoding="utf-8")
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          print(merged.to_string(index=False))

          # Regression-only gate for the primary portable detector.
          # Kelly has already been inspected, so it is NOT used to tune model
          # weights or thresholds.  The loose gate only catches implementation
          # regressions.  Final transfer claims come from post-freeze Bromelia
          # and jDiameter confirmations, not from this development-domain gate.
          static_benign_fpr = float(
              native_benign_summary["external_benign_fpr"])
          if native_tpr < 0.75:
              raise SystemExit(
                  f"PCAP-native development-regression TPR below 75%: "
                  f"{native_tpr:.3f}")
          if native_fpr > 0.25:
              raise SystemExit(
                  f"PCAP-native attack-holdout benign FPR above 25%: "
                  f"{native_fpr:.3f}")
          if static_benign_fpr > 0.25:
              raise SystemExit(
                  f"PCAP-native static benign FPR above 25%: "
                  f"{static_benign_fpr:.3f}")

          robust_tpr = float(robust_summary["iso_robust_external_attack_tpr"])
          robust_fpr = float(robust_summary["iso_robust_external_benign_fpr"])
          print(
              "Robust IF diagnostic only: "
              f"TPR={robust_tpr:.3f}, FPR={robust_fpr:.3f}")
          PY

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## PCAP-native Diameter transfer validation"
            for f in               results_pcap_native_train/training_summary.json               results_pcap_native_benign/summary.json               results_pcap_native_attacks/summary.json               results_pcap_native_hybrid/summary.json; do
              if [ -f "$f" ]; then
                echo
                echo "### $f"
                echo '~~~json'
                cat "$f"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop independent HSS
        if: always()
        run: |
          if [ -f /tmp/external_hss.pid ]; then
            kill "$(cat /tmp/external_hss.pid)" || true
          fi
          tail -n 100 external_hss.log || true

      - name: Upload PCAP-native transfer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diameter-pcap-native-transfer
          path: |
            results_pcap_native_calibration/
            results_pcap_native_train/
            results_pcap_native_benign/
            results_pcap_native_attacks/
            results_pcap_native_robust_if/
            results_pcap_native_hybrid/
            orange_calibration_pcaps/
            kelly_benign/
            kelly_attack_holdout/
            external_hss.log
          if-no-files-found: warn
