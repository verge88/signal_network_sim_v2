name: SS7 targeted-abuse v5 latest RANK audit
# frozen source run: 46129732243
on:
  push:
    branches: [ss7-anti-overfit-development]
    paths:
      - .github/workflows/ss7-targeted-v5-latest-rank-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  SS7_TARGETED_ABUSE_V5: "1"
  SS7_DEPLOY_BASELINE: "180"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46129732243
          pattern: targeted-v5-world-compact-*
          path: results/incoming
      - run: |
          mkdir -p results/worlds
          for d in results/incoming/targeted-v5-world-compact-*; do
            mv "$d" "results/worlds/${d##*/targeted-v5-}"
          done
      - run: python -m py_compile ss7/naive_role_union_rank_audit.py
      - run: python -u -m ss7.naive_role_union_rank_audit --root results/worlds --output results/audit --seeds 24101 24102 24103
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-targeted-v5-latest-rank-audit
          path: results/audit
          retention-days: 7
