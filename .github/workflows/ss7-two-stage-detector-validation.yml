name: SS7 two-stage detector validation

on:
  push:
    branches:
      - validate-ss7-real-cdr
    paths:
      - "ss7/validate_two_stage_detector.py"
      - "ss7/validate_context_aware_detector.py"
      - "ss7/validate_calibrated_detectors.py"
      - "ss7/fix.py"
      - ".github/workflows/ss7-two-stage-detector-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ss7/validate_two_stage_detector.py"
      - "ss7/validate_context_aware_detector.py"
      - "ss7/validate_calibrated_detectors.py"
      - "ss7/fix.py"
      - ".github/workflows/ss7-two-stage-detector-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-two-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy networkx scikit-learn

      - name: Run two-stage SS7 validation
        run: |
          set -o pipefail
          mkdir -p results/ss7_two_stage_validation
          python -m ss7.validate_two_stage_detector \
            --development-seeds 42 1337 \
            --calibration-seed 2026 \
            --evaluation-seeds 7001 7002 7003 7004 7005 \
            --development-days 1.1 \
            --evaluation-days 1.25 \
            --output-dir results/ss7_two_stage_validation \
            2>&1 | tee results/ss7_two_stage_validation/validation.log

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss7-two-stage-detector-validation
          path: results/ss7_two_stage_validation/
          if-no-files-found: warn
          retention-days: 30
