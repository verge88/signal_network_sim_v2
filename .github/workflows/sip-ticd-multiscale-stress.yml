name: Stress-test frozen improved SIP TICD under shift
on:
  push:
    branches: [improve/ticd-temporal-invariant-consensus]
    paths:
      - 'experiments/stress_sip_ticd_multiscale.py'
      - '.github/workflows/sip-ticd-multiscale-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
      - name: Fetch frozen trained model from held-out comparison action
        run: |
          set -euo pipefail
          mkdir -p prior
          gh run download 45237816494 --repo "${{ github.repository }}" --name sip-ticd-multiscale-retrained-and-comparison --dir prior
          model_file="$(find prior -type f -name ticd_multiscale_model.pkl -print -quit)"
          test -n "$model_file"
          echo "PRIOR_DIR=$(dirname "$model_file")" >> "$GITHUB_ENV"
      - name: Simulate lower covert rate, changed losses and a different reporting threat
        run: python -m experiments.stress_sip_ticd_multiscale --prior-dir "$PRIOR_DIR" --out-dir results_ticd_stress
      - name: Publish limitations
        if: always()
        run: |
          if [ -f results_ticd_stress/untouched_sensitivity_report.json ]; then
            echo '## Fixed-model robustness on out-of-selection synthetic scenarios' >> "$GITHUB_STEP_SUMMARY"
            echo 'This is not real SIP proxy compromise validation. Thresholds and architecture were NOT refitted.' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("results_ticd_stress/untouched_sensitivity_report.json"))
          for k,v in d["groups"].items():
              print(k)
              for n in ("baseline","model"):
                  z=v[n]
                  print(n,"FPR",z["fpr"],"RECALL",z["tpr_recall"],
                    "SOPH",z["by_compromise_sophistication"])
          PY
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-multiscale-out-of-selection-stress
          path: results_ticd_stress/
          if-no-files-found: warn
          retention-days: 30
