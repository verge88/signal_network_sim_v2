name: SIP TICD adaptive temporal memory
on:
  push:
    branches: [study/ticd-adaptive-memory]
    paths:
      - 'sip/ticd_adaptive_memory.py'
      - 'experiments/evaluate_ticd_adaptive_memory.py'
      - '.github/workflows/sip-ticd-adaptive-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_adaptive_memory.py experiments/evaluate_ticd_adaptive_memory.py
          python -m pip freeze > adaptive_memory_environment.txt
      - name: Recover full-invariant separate channel models
        run: |
          set -euo pipefail
          gh run download 45441388811 --repo "${{ github.repository }}" --name sip-ticd-separate-robust-fusion --dir prior
          p="$(find prior -type f -name separate_robust_models.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Evaluate adaptive memory and sequential weak evidence
        run: python -m experiments.evaluate_ticd_adaptive_memory --prior "$PRIOR_DIR" --out results_adaptive_memory
      - name: Verify paired holdout and causal safeguards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_adaptive_memory/adaptive_memory_report.json'))
          assert not d['test_used_for_selection'] and not d['real_field_validation']
          assert all(d[k] for k in ('all_original_invariants_preserved','prefix_causality','label_and_batch_invariance','observational_equivalence_verified','instant_not_attenuated','reload_verified'))
          assert len(d['candidates'])==64
          for v in d['candidates'].values():
              assert v['all_original_invariants_preserved']
              assert sum(v['budgets'])<=.008+1e-12 and v['warning_budget']==.004
          seeds=[s for k in ('training_seeds','validation_seeds','development_seeds','test_seeds') for xs in d[k].values() for s in xs]
          assert len(seeds)==len(set(seeds))==298
          assert len(d['heldout'])==25 and len(d['summary'])==6
          for k,mods in d['heldout'].items():
              assert len(mods)==6
              for n,v in mods.items():
                  assert v['rows']==23760
                  assert [r['seed'] for r in d['per_seed'][k][n]]==d['test_seeds'][k]
                  assert v['complete_rows']+v['partial_rows']+v['unobservable_rows']==v['rows']
          print('MEMORY_AUDIT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-adaptive-memory
          path: |
            results_adaptive_memory/
            adaptive_memory_environment.txt
          if-no-files-found: warn
          retention-days: 30
