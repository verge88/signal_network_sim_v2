name: SS7 hard-negative robust INV validation

on:
  push:
    branches:
      - ss7-hard-negative-validation-20261124
    paths:
      - "ss7/validate_hard_negative_inv.py"
      - ".github/workflows/ss7-hard-negative-inv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hard-negative-inv:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy networkx scikit-learn joblib

      - name: Run hard-negative robust INV validation
        run: |
          set -o pipefail
          mkdir -p results/ss7_hard_negative_inv
          python -m ss7.validate_hard_negative_inv \
            --development-seeds 42 1337 5151 \
            --evaluation-seeds 7001 7002 7003 7004 7005 \
            --development-days 1.0 \
            --evaluation-days 1.25 \
            --output-dir results/ss7_hard_negative_inv \
            2>&1 | tee results/ss7_hard_negative_inv/validation.log

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss7-hard-negative-inv-validation
          path: results/ss7_hard_negative_inv/
          if-no-files-found: warn
          retention-days: 30
