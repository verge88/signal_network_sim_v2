name: SS7 role-action frozen-model eval
on:
  push:
    branches: [ss7-role-action-compromise-development]
    paths:
      - .github/workflows/ss7-role-action-eval-only.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ss7-role-action-eval-only-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cu_compact_channel_development.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46065844802
          pattern: role-world-21[123]*
          path: results/worlds
      - run: |
          for d in results/worlds/role-world-*; do
            b=$(basename "$d"); s=${b#role-world-}; mv "$d" "results/worlds/world-compact-$s"
          done
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46065844802
          name: role-action-models
          path: results/trained
      - run: python -u -m ss7.cu_compact_channel_development evaluate --arm compact --root results/worlds --models results/trained --output results/eval
      - uses: actions/upload-artifact@v4
        with:
          name: role-action-weighted-eval
          path: results/eval
          retention-days: 7
