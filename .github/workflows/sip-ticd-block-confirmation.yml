name: SIP TICD context calibration and disjoint-block confirmation
on:
  push:
    branches: [study/ticd-block-confirmation]
    paths:
      - 'sip/ticd_block_confirmation.py'
      - 'experiments/evaluate_ticd_block_confirmation.py'
      - '.github/workflows/sip-ticd-block-confirmation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_block_confirmation.py experiments/evaluate_ticd_block_confirmation.py
          python -m pip freeze > block_confirmation_environment.txt
      - name: Recover frozen conditional TICD and report
        run: |
          set -euo pipefail
          gh run download 45455545825 --repo "${{ github.repository }}" --name sip-ticd-conditional-baseline --dir prior
          p="$(find prior -type f -name conditional_baseline_models.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Replay tail errors and evaluate block evidence
        run: python -m experiments.evaluate_ticd_block_confirmation --prior "$PRIOR_DIR" --out results_block_confirmation
      - name: Verify frozen architecture and independent evaluation
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_block_confirmation/block_confirmation_report.json'))
          assert not d['test_used_for_selection'] and not d['real_field_validation']
          assert all(d[k] for k in ('all_original_invariants_preserved','prefix_causality','label_and_batch_invariance','observational_equivalence_verified','old_count_preserved','actual_transport_loss_not_observed','retrospective_diagnostic_only','reload_verified'))
          assert len(d['candidates'])==96
          for v in d['candidates'].values():
              assert v['all_original_invariants_preserved']
              assert sum(v['budgets'])<=.008+1e-12 and v['warning_budget']==.0035
          seeds=[s for k in ('training_seeds','validation_seeds','development_seeds','test_seeds') for xs in d[k].values() for s in xs]
          assert len(seeds)==len(set(seeds))==346
          assert len(d['development'])==len(d['heldout'])==25 and len(d['summary'])==6
          for k,mods in d['heldout'].items():
              assert len(mods)==6
              for n,v in mods.items():
                  assert v['rows']==23760
                  assert [r['seed'] for r in d['per_seed'][k][n]]==d['test_seeds'][k]
                  assert v['complete_rows']+v['partial_rows']+v['unobservable_rows']==v['rows']
          print('BLOCK_AUDIT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-block-confirmation
          path: |
            results_block_confirmation/
            block_confirmation_environment.txt
          if-no-files-found: warn
          retention-days: 30
