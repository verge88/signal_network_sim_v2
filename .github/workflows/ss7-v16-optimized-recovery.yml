name: SS7 v16 optimized recovery 36102-36103
on:
  push:
    branches: [ss7-anti-overfit-development]
    paths:
      - .github/workflows/ss7-v16-optimized-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  SS7_SUBSCRIBER_KIE_V16: "1"
  SS7_DEPLOY_BASELINE: "180"
jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [36102,36103]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cu_compact_channel_development.py ss7/peer_service_identity_v16_rank_audit.py
      - run: python -u -m ss7.cu_compact_channel_development selftest
      - run: python -u -m ss7.cu_compact_channel_development generate --arm compact --seed ${{ matrix.seed }} --output results/world
      - uses: actions/upload-artifact@v4
        with:
          name: v16-opt-world-compact-${{ matrix.seed }}
          path: results/world
          retention-days: 7

  audit:
    needs: worlds
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46150366493
          name: v16-world-compact-36101
          path: results/worlds/world-compact-36101
      - uses: actions/download-artifact@v4
        with:
          pattern: v16-opt-world-compact-*
          path: results/incoming
      - run: |
          for d in results/incoming/v16-opt-world-compact-*; do
            mv "$d" "results/worlds/${d##*/v16-opt-}"
          done
      - run: python -u -m ss7.peer_service_identity_v16_rank_audit --root results/worlds --output results/audit --seeds 36101 36102 36103
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-peer-service-identity-v16-optimized-rank
          path: results/audit
          retention-days: 7
