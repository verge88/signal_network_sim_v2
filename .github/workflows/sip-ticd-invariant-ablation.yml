name: SIP TICD complete paired invariant ablation
on:
  push:
    branches: [study/ticd-complete-invariant-ablation]
    paths:
      - 'sip/ticd_invariant_ablation.py'
      - 'experiments/evaluate_ticd_invariant_ablation.py'
      - '.github/workflows/sip-ticd-invariant-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_invariant_ablation.py experiments/evaluate_ticd_invariant_ablation.py
          python -m pip freeze > invariant_ablation_environment.txt
      - name: Recover article detector
        run: |
          set -euo pipefail
          gh run download 45377337545 --repo "${{ github.repository }}" --name sip-ticd-role-adaptive-causal-model-and-holdout --dir prior
          p="$(find prior -type f -name role_adaptive_causal_ticd.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Evaluate all ablations on identical untouched runs
        run: python -m experiments.evaluate_ticd_invariant_ablation --prior "$PRIOR_DIR" --out results_invariant_ablation
      - name: Verify all paired variants and null control
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_invariant_ablation/invariant_ablation_report.json'))
          assert not d['real_field_validation'] and not d['selection_on_test']
          assert all(d[k] for k in ('exact_frozen_full','null_control_verified','label_invariance','batch_invariance','reload_verified'))
          seeds=[s for k in ('training_seeds','validation_seeds','test_seeds') for xs in d[k].values() for s in xs]
          assert len(seeds)==len(set(seeds))==136
          assert len(d['variants'])==17 and len(d['policies'])==2
          for k,pair in d['heldout'].items():
              assert len(pair)==34
              for n,v in pair.items():
                  assert v['confirmed_TP']+v['warning_only_TP']==v['covered_attack_rows']
                  assert [x['seed'] for x in d['per_seed'][k][n]]==d['test_seeds'][k]
                  if n.endswith('__no_all_invariants'):
                      assert v['confirmed_TP']==v['confirmed_FP']==v['warning_only_TP']==v['warning_only_FP']==0
          print('ABLATION_AUDIT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-complete-invariant-ablation
          path: |
            results_invariant_ablation/
            invariant_ablation_environment.txt
          if-no-files-found: warn
          retention-days: 30
