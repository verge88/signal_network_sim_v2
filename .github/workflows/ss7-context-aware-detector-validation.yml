name: SS7 context-aware detector validation

on:
  push:
    branches:
      - validate-ss7-real-cdr
    paths:
      - "ss7/validate_context_aware_detector.py"
      - "ss7/validate_calibrated_detectors.py"
      - "ss7/fix.py"
      - ".github/workflows/ss7-context-aware-detector-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ss7/validate_context_aware_detector.py"
      - "ss7/validate_calibrated_detectors.py"
      - "ss7/fix.py"
      - ".github/workflows/ss7-context-aware-detector-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-context-aware-detector:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy networkx scikit-learn

      - name: Validate context-aware SS7 detector
        run: |
          set -o pipefail
          mkdir -p results/ss7_context_aware_validation
          python -m ss7.validate_context_aware_detector \
            --seeds 6001 6002 6003 6004 6005 \
            --days 1.25 \
            --output-dir results/ss7_context_aware_validation \
            2>&1 | tee results/ss7_context_aware_validation/validation.log

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss7-context-aware-detector-validation
          path: results/ss7_context_aware_validation/
          if-no-files-found: warn
          retention-days: 30
