name: SIP TICD causal ACK persistence heldout evaluation
on:
  push:
    branches: [improve/ticd-causal-persistent-ack]
    paths:
      - '.github/workflows/sip-ticd-causal-ack.yml'
      - 'sip/ticd_causal_ack.py'
      - 'experiments/retrain_ticd_causal_ack.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  causal-ack-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific runtime and compile architecture sources
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_causal_ack.py experiments/retrain_ticd_causal_ack.py
          python -m pip freeze > causal_ack_environment.txt
      - name: Retrieve prior frozen loss-aware TICD model and pinned real PCAP calibration
        run: |
          set -euo pipefail
          mkdir -p previous reference
          gh run download 45241995039 --repo "${{ github.repository }}" --name sip-ticd-loss-aware-retrained-evaluation --dir previous
          gh run download 45234641925 --repo "${{ github.repository }}" --name sip-ticd-calibrated-retrained-model-and-evidence --dir reference
          saved="$(find previous -type f -name ticd_loss_adaptive_model.pkl -print -quit)"
          cal="$(find reference -type f -name sip_real_method_calibration.json -print -quit)"
          test -n "$saved"
          test -n "$cal"
          cp "$cal" real_lte_sip_calibration.json
          echo "PREVIOUS_DIR=$(dirname "$saved")" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          d=json.load(open('real_lte_sip_calibration.json'))
          assert d['source_archive_sha256']=='e455d66eef30d9399ba3beefc36ad2a4a7e2fac0684aa1ae405a30a2371af9a7'
          assert d['calibration_kind']=='partial_benign_SIP_method_profile'
          print('REAL_LTE_PROFILE_CALIBRATION_SOURCE_VERIFIED')
          PY
      - name: Build causal master ACK history, fit normal-only reference, select on development and test on untouched seeds
        run: |
          python -m experiments.retrain_ticd_causal_ack --prior "$PREVIOUS_DIR" --calibration real_lte_sip_calibration.json --output results_ticd_causal_ack
      - name: Verify model reload and holdout isolation
        run: |
          python - <<'PY'
          import json,pickle,sys
          from pathlib import Path
          sys.path.insert(0,'sip')
          p=Path('results_ticd_causal_ack')
          r=json.loads((p/'causal_ack_retraining_report.json').read_text())
          with (p/'ticd_causal_ack_model.pkl').open('rb') as f:m=pickle.load(f)
          assert r['reloaded'] and r['future_value_leak_test_passed']
          assert r['max_batch_score_difference']<=1e-12
          assert not r['full_real_TICD_validation']
          assert m['model'].fitted
          assert m['threshold']==r['decision_thresholds'][r['chosen']]
          parts=['training_seeds','normal_validation_seeds','development_seeds','heldout_seeds']
          sets=[{s for a in r[k].values() for s in a} for k in parts]
          assert all(a.isdisjoint(b) for i,a in enumerate(sets) for b in sets[i+1:])
          assert 'clean_loss20' in r['heldout_results']
          print('CAUSAL_ACK_RETRAINED_MODEL_RELOAD_SUCCESS',r['chosen'])
          PY
      - name: Publish heldout findings without overstating real-world applicability
        if: always()
        run: |
          if [ -f results_ticd_causal_ack/causal_ack_retraining_report.json ]; then
            echo '## Causal ACK persistent-signal TICD vs frozen loss-aware baseline' >> "$GITHUB_STEP_SUMMARY"
            echo 'Metrics describe separate held-out SIMULATION SEEDS; not independent real SIP compromise.' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('results_ticd_causal_ack/causal_ack_retraining_report.json'))
          print('Selected:',r['chosen'])
          print('Training normal:',r['training_normal_rows'])
          print('Validation normal:',r['validation_normal_rows'])
          for cohort,s in r['heldout_results'].items():
              a,b=s['baseline'],s[r['chosen']]
              print(cohort,'baseline FPR',a['fpr'],'candidate FPR',b['fpr'],
                    'baseline recall',a['recall'],'candidate recall',b['recall'],
                    'baseline statistical',a['by_sophistication']['statistical']['recall'],
                    'candidate statistical',b['by_sophistication']['statistical']['recall'])
          PY
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-causal-ack-retrained-heldout
          path: |
            results_ticd_causal_ack/
            real_lte_sip_calibration.json
            causal_ack_environment.txt
          if-no-files-found: warn
          retention-days: 30
