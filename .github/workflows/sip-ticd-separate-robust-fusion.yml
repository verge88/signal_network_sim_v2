name: SIP TICD independent channel calibration and robust memory
on:
  push:
    branches: [study/ticd-separate-robust-fusion]
    paths:
      - 'sip/ticd_separate_robust_fusion.py'
      - 'experiments/evaluate_ticd_separate_robust_fusion.py'
      - '.github/workflows/sip-ticd-separate-robust-fusion.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip/ticd_separate_robust_fusion.py experiments/evaluate_ticd_separate_robust_fusion.py
          python -m pip freeze > separate_robust_environment.txt
      - name: Recover frozen full-invariant count models
        run: |
          set -euo pipefail
          gh run download 45438008085 --repo "${{ github.repository }}" --name sip-ticd-full-count-evidence --dir prior
          p="$(find prior -type f -name full_count_ticd_models.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Diagnose and evaluate independent channel calibration
        run: python -m experiments.evaluate_ticd_separate_robust_fusion --prior "$PRIOR_DIR" --out results_separate_robust
      - name: Verify common holdout, decision budgets and integrity
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_separate_robust/separate_robust_report.json'))
          assert not d['test_used_for_selection'] and not d['real_field_validation']
          assert all(d[k] for k in ('all_original_invariants_preserved','prefix_causality','observational_equivalence_verified','label_and_batch_invariance','reload_verified'))
          assert len(d['candidates'])==60
          for v in d['candidates'].values():
              assert v['all_original_invariants_preserved'] and v['total_benign_budget']<=.008+1e-12
          seeds=[s for k in ('training_seeds','validation_seeds','development_seeds','test_seeds') for xs in d[k].values() for s in xs]
          assert len(seeds)==len(set(seeds))==290
          assert len(d['heldout'])==25 and len(d['summary'])==7
          for k,mods in d['heldout'].items():
              assert len(mods)==7
              for n,v in mods.items():
                  assert v['rows']==23760
                  assert [r['seed'] for r in d['per_seed'][k][n]]==d['test_seeds'][k]
                  assert v['complete_rows']+v['partial_rows']+v['unobservable_rows']==v['rows']
          print('SPLIT_AUDIT_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-separate-robust-fusion
          path: |
            results_separate_robust/
            separate_robust_environment.txt
          if-no-files-found: warn
          retention-days: 30
