name: SS7 robust five-world observability audit
on:
  push:
    branches: [ss7-anti-overfit-robust-dev]
    paths:
      - .github/workflows/ss7-robust-fiveworld-audit.yml
      - ss7/naive_observability_diagnostic.py
      - ss7/cu_compact_channel_development.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ss7-robust-fiveworld-audit-${{ github.ref }}
  cancel-in-progress: true
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [21001,21002,21003,21101,21102]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cu_compact_channel_development.py ss7/naive_observability_diagnostic.py
      - run: python -u -m ss7.cu_compact_channel_development selftest
      - run: python -u -m ss7.cu_compact_channel_development generate --arm compact --seed ${{ matrix.seed }} --output results/world
      - uses: actions/upload-artifact@v4
        with:
          name: robust-world-compact-${{ matrix.seed }}
          path: results/world
          retention-days: 7

  audit:
    needs: worlds
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          pattern: robust-world-compact-*
          path: results/incoming
      - run: |
          mkdir -p results/worlds
          for seed in 21001 21002 21003 21101 21102; do
            mv results/incoming/robust-world-compact-${seed} results/worlds/world-compact-${seed}
          done
      - run: python -u -m ss7.naive_observability_diagnostic --root results/worlds --output results/audit --seeds 21001 21002 21003 21101 21102
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-robust-fiveworld-audit
          path: results/audit
          retention-days: 7
