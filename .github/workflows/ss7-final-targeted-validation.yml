name: SS7 final targeted validation

on:
  push:
    branches:
      - ss7-final-validation-20261124
    paths:
      - ".github/workflows/ss7-final-targeted-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy networkx scikit-learn joblib

      - name: Recalibrate on corrected SS7 generator
        run: |
          set -o pipefail
          mkdir -p results/final_full_calibration
          python -m ss7.calibrate_full_model \
            --real-train-date 2013-11-01 \
            --real-validation-date 2013-11-02 \
            --real-test-date 2013-11-03 \
            --max-bytes-per-day 67108864 \
            --max-real-windows-per-day 120000 \
            --overall-target-fpr 0.01 \
            --seed 42 \
            --secondary-seed 1337 \
            --confirm-seed 2026 \
            --synthetic-days 1.0 \
            --output-dir results/final_full_calibration \
            2>&1 | tee results/final_full_calibration/calibration.log

      - name: Upload calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss7-final-full-calibration
          path: results/final_full_calibration/
          if-no-files-found: warn
          retention-days: 30

  context-aware-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy networkx scikit-learn joblib

      - name: Validate context-aware INV architecture
        run: |
          set -o pipefail
          mkdir -p results/final_context_aware
          python -m ss7.validate_context_aware_detector \
            --seeds 6001 6002 6003 6004 6005 \
            --days 1.25 \
            --output-dir results/final_context_aware \
            2>&1 | tee results/final_context_aware/validation.log

      - name: Upload context validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss7-final-context-aware
          path: results/final_context_aware/
          if-no-files-found: warn
          retention-days: 30
