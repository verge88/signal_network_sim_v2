name: SIP TICD sensor reconciliation and uncertainty calibration
on:
  push:
    branches: [study/ticd-sensor-reconciliation]
    paths:
      - 'sip/ticd_sensor_reconciliation.py'
      - 'sip/ticd_measured_loss.py'
      - 'sip/ticd_sequential_physical.py'
      - 'sip/ticd_correlated_block_evidence.py'
      - 'experiments/evaluate_ticd_sensor_reconciliation.py'
      - '.github/workflows/sip-ticd-sensor-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and compile
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'networkx>=3,<4'
          python -m compileall -q sip experiments/evaluate_ticd_sensor_reconciliation.py
          python -m pip freeze > reconciliation_environment.txt
      - name: Recover frozen comparators
        run: |
          set -euo pipefail
          gh run download 45626804800 --repo "${{ github.repository }}" --name sip-ticd-joint-channel --dir prior
          p="$(find prior -type f -name joint_channel_models.pkl -print -quit)"
          test -n "$p"
          echo "PRIOR_DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Calibrate measurement variance and refit and evaluate
        run: python -m experiments.evaluate_ticd_sensor_reconciliation --prior "$PRIOR_DIR" --out results_sensor_reconciliation
      - name: Verify experiment integrity
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results_sensor_reconciliation/sensor_reconciliation_report.json'))
          assert not d['test_used_for_selection'] and not d['real_field_validation']
          assert all(d[k] for k in ('prefix_causality','oracle_removal_verified','observational_equivalence_verified','full_reference_refit','all_original_invariants_preserved'))
          seeds=[s for k in ('variance_seeds','training_seeds','scale_seeds','validation_seeds','development_seeds','test_seeds') for ss in d[k].values() for s in ss]
          assert len(seeds)==len(set(seeds))
          assert len(d['heldout'])==40 and len(d['summary'])==10 and len(d['paired'])==15
          assert all(len(v)==10 for v in d['test_seeds'].values())
          print('RECON_AUDIT_VERIFIED', 'operational_gate_pass=',d['operational_gate_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-ticd-sensor-reconciliation
          path: |
            results_sensor_reconciliation/
            reconciliation_environment.txt
          if-no-files-found: warn
          retention-days: 30
