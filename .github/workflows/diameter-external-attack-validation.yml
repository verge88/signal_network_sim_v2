name: Diameter external reproduced attacks

on:
  push:
    branches:
      - main
      - validation/diameter-external-attacks
    paths:
      - "diameter/**"
      - "experiments/diameter_external_pcap_validation.py"
      - "experiments/diameter_external_attack_validation.py"
      - "experiments/diameter_external_attack_driver.dart"
      - ".github/workflows/diameter-external-attack-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diameter-external-attacks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduced-attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout detector repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install system dependencies
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark tcpdump netcat-openbsd

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn networkx

      - name: Checkout pinned independent Diameter implementation
        env:
          EXTERNAL_COMMIT: 8917b2d8d4ab16a2877a7c2c1bccb1bc2e789864
        run: |
          git clone --filter=blob:none https://github.com/KellyKinyama/diameter-protocol.git external_diameter
          git -C external_diameter checkout "${EXTERNAL_COMMIT}"
          cp experiments/diameter_external_attack_driver.dart external_diameter/bin/external_attack_driver.dart
          cd external_diameter
          dart pub get
          dart analyze bin/external_attack_driver.dart

      - name: Start independent S6a HSS
        run: |
          (
            cd external_diameter
            HSS_BIND=127.0.0.1             HSS_PORT=3868             HSS_ORIGIN_HOST=hss.open5gs.org             HSS_ORIGIN_REALM=open5gs.org             dart run bin/hss_stub.dart
          ) > external_hss.log 2>&1 &
          echo $! > /tmp/external_hss.pid

          for i in {1..30}; do
            if nc -z 127.0.0.1 3868; then
              echo "External HSS is ready"
              exit 0
            fi
            sleep 1
          done

          cat external_hss.log
          exit 1

      - name: Capture paired benign and attack S6a traces
        env:
          S6A_HOST: 127.0.0.1
          S6A_PORT: "3868"
          S6A_DEST_REALM: open5gs.org
          S6A_IMSI: "999700000000001"
        run: |
          set -euo pipefail
          mkdir -p reproduced_attack_pcaps
          manifest="reproduced_attack_pcaps/manifest.csv"
          echo "capture,expected_label,scenario" > "${manifest}"

          capture_case() {
            name="$1"
            label="$2"
            scenario="$3"
            count="$4"
            delay_ms="$5"
            out="$GITHUB_WORKSPACE/reproduced_attack_pcaps/${name}"

            sudo tcpdump -i lo -U -s 0 -w "${out}" 'tcp port 3868'               >"/tmp/tcpdump-${name}.log" 2>&1 &
            cap_pid=$!
            sleep 1.25

            (
              cd external_diameter
              dart run bin/external_attack_driver.dart                 "${scenario}" "${count}" "${delay_ms}"
            )

            sleep 0.75
            sudo pkill -INT -x tcpdump || true
            wait "${cap_pid}" || true
            sudo chown "$USER":"$USER" "${out}"
            test -s "${out}"
            echo "${name},${label},${scenario}" >> "${manifest}"
          }

          # Benign controls: attach-like AIR+ULR and deliberately pure AIR
          # re-authentication, paced slowly enough to represent control traffic.
          capture_case benign_attach_1.pcap benign benign_attach 1 800
          capture_case benign_attach_2.pcap benign benign_attach 2 1200
          capture_case benign_reauth_2.pcap benign benign_reauth 2 1200
          capture_case benign_reauth_3.pcap benign benign_reauth 3 1500

          # Reproduced attack patterns over the same independent S6a stack.
          capture_case attack_air_flood_20.pcap attack air_flood 20 0
          capture_case attack_air_flood_80.pcap attack air_flood 80 0
          capture_case attack_ulr_flood_20.pcap attack ulr_flood 20 0
          capture_case attack_ulr_flood_80.pcap attack ulr_flood 80 0
          capture_case attack_mixed_flood_20.pcap attack mixed_flood 20 0
          capture_case attack_mixed_flood_60.pcap attack mixed_flood 60 0
          capture_case attack_tracking_burst_10.pcap attack tracking_burst 10 0
          capture_case attack_tracking_burst_30.pcap attack tracking_burst 30 0

          {
            echo "External Diameter implementation: KellyKinyama/diameter-protocol"
            echo "Pinned commit: 8917b2d8d4ab16a2877a7c2c1bccb1bc2e789864"
            echo "Transport: real TCP loopback captured by tcpdump"
            echo "Target: third-party in-repository S6a HSS implementation"
            echo "Labels: controlled reproduced-lab scenarios generated at CI time"
            echo "These are not production operator traces."
          } > reproduced_attack_pcaps/PROVENANCE.txt

          sha256sum reproduced_attack_pcaps/*.pcap             | tee reproduced_attack_pcaps/SHA256SUMS

      - name: Decode reproduced trace inventory
        run: |
          for pcap in reproduced_attack_pcaps/*.pcap; do
            echo "=== ${pcap} ==="
            capinfos -c -u "${pcap}" || true
            td=$(mktemp -d)
            cp "${pcap}" "${td}/input.pcap"
            tshark -r "${td}/input.pcap" -Y diameter -T fields               -e diameter.cmd.code -e diameter.applicationId |               sort | uniq -c
            rm -rf "${td}"
          done

      - name: Run independent attack validation
        run: |
          PYTHONPATH=experiments:. python experiments/diameter_external_attack_validation.py             --manifest reproduced_attack_pcaps/manifest.csv             --pcap-dir reproduced_attack_pcaps             --out-dir results_external_diameter_attacks

      - name: Publish validation summary
        if: always()
        run: |
          if [ -f results_external_diameter_attacks/summary.json ]; then
            {
              echo "## Diameter reproduced-attack validation"
              echo
              echo '~~~json'
              cat results_external_diameter_attacks/summary.json
              echo '~~~'
              echo
              echo "### Per-capture predictions"
              echo
              echo '~~~'
              cat results_external_diameter_attacks/external_attack_predictions.csv
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop independent HSS
        if: always()
        run: |
          if [ -f /tmp/external_hss.pid ]; then
            kill "$(cat /tmp/external_hss.pid)" || true
          fi
          tail -n 200 external_hss.log || true

      - name: Upload reproduced attack artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diameter-external-reproduced-attacks
          path: |
            results_external_diameter_attacks/
            reproduced_attack_pcaps/
            external_hss.log
          if-no-files-found: warn
