name: SS7 CUSUM cascade development
on:
  push:
    branches: [ss7-cusum-cascade-development]
    paths: [.github/workflows/ss7-cusum-cascade-development.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ss7-cusum-cascade-development-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [9101,9102,9103,9104,9105,9106,9107,9108]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - run: python -m py_compile ss7/cusum_cascade_development.py
      - name: Check bounded CUSUM and joint calibration
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from ss7.cusum_cascade_development import bounded_cusum, fit, apply
          from ss7.incident_calibration_study import elapsed, triple, bucket_peaks
          rng=np.random.default_rng(12)
          d=pd.DataFrame(dict(nid=[1]*5+[2]*4,t=[0,1,2,4,5,0,1,2,3],label=[0]*9))
          s=1/(1+np.exp(-np.array([-2.,1.,1.,-1.,2.,2.,-1.,2.,-2.])))
          expected=np.array([0,1,2,0,2,2,1,3,0])/3
          assert np.allclose(bounded_cusum(d,s,0.,3),expected)
          z=bounded_cusum(d,s,0.,3)
          for i in range(1,len(d)+1):
              assert np.allclose(bounded_cusum(d.iloc[:i],s[:i],0.,3),z[:i])
          # Independently compute all valid trailing sums for randomized inputs.
          x=rng.uniform(.001,.999,len(d))
          inc=np.clip(np.log(x/(1-x))-.2,-3,3)
          for k in (1,3,6,12):
              ref=[]
              for i in range(len(d)):
                  values=[0.]
                  for j in range(max(0,i-k+1),i+1):
                      a=d.iloc[j:i+1]
                      if a.nid.nunique()==1 and a.t.iloc[-1]-a.t.iloc[0]==i-j:
                          values.append(inc[j:i+1].sum())
                  ref.append(max(values)/k)
              assert np.allclose(bounded_cusum(d,x,.2,k),ref)
          rule=fit((d,),(s,),3,.95,.5)
          u,f,c=apply(d,s,rule)
          assert np.array_equal(u>0,(f>0)|(c>0))
          assert (u>0).sum()<=int(10*elapsed(d))
          assert (bucket_peaks(d,triple(d,u))>0).sum()<=int(elapsed(d))
          altered=d.assign(label=1)
          assert np.array_equal(apply(altered,s,rule)[0],u)
          print("CUSUM, prefix causality, gaps and joint budget checks passed")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: report-only-frozen
          path: results/frozen
          github-token: ${{ github.token }}
          run-id: 45421952080
      - uses: actions/download-artifact@v4
        with:
          name: incident-local-models
          path: results/local
          github-token: ${{ github.token }}
          run-id: 45440533210
      - run: |
          set -o pipefail
          mkdir -p results/seed_${{ matrix.seed }}
          python -u -m ss7.cusum_cascade_development test --seed ${{ matrix.seed }} --local results/local/local_models.joblib --frozen results/frozen/models.joblib --output results/seed_${{ matrix.seed }} 2>&1 | tee results/seed_${{ matrix.seed }}/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cusum-seed-${{ matrix.seed }}
          path: results/seed_${{ matrix.seed }}
  aggregate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 pandas==3.1.1 scipy==1.17.1 scikit-learn==1.9.1 networkx==3.6.1 joblib==1.6.0
      - uses: actions/download-artifact@v4
        with:
          pattern: cusum-seed-*
          path: results/collected
      - run: python -m ss7.cusum_cascade_development aggregate --input results/collected --output results/summary
      - uses: actions/upload-artifact@v4
        with:
          name: ss7-cusum-cascade-development-summary
          path: results/summary
